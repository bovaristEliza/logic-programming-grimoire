<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}">
  <link rel="icon" href="{{ '/assets/sigils/fixpoint.svg' | relative_url }}" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=IM+Fell+English:ital@0;1&family=UnifrakturMaguntia&display=swap">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
  <link rel="stylesheet" href="{{ '/assets/css/grimoire.css' | relative_url }}">
</head>
<body class="{{ page.layout }}">
  <a class="skip" href="#main">Skip to the text</a>
  <header class="running-head">
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    {% if page.book %}<span>{{ page.book }}</span>{% endif %}
  </header>
  <main id="main">
    {{ content }}
  </main>
  <footer class="colophon">
    <p>Set in EB Garamond and IM Fell English. Follows the order of J. W. Lloyd, <cite>Foundations of Logic Programming</cite>, 2nd ed., Springer, 1987; the text is our own.</p>
  </footer>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js"></script>
  <script defer src="{{ '/assets/js/math.js' | relative_url }}"></script>
</body>
</html>
