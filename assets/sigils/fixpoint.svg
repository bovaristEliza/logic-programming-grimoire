<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-label="Sigil of the fixpoint">
  <style>
    .g{stroke:#9a7a26;fill:none}
    .l{stroke:#27407a;fill:none}
    .d{fill:#27407a}
    @media (prefers-color-scheme: dark){.g{stroke:#d4b25a}.l{stroke:#9fb3e6}.d{fill:#9fb3e6}}
  </style>
  <!-- the stages T↑0 ⊆ T↑1 ⊆ T↑2 ⊆ ... drawn as widening rings -->
  <circle class="d" cx="60" cy="60" r="2.4"/>
  <circle class="l" cx="60" cy="60" r="12" stroke-width="1" stroke-dasharray="2 3"/>
  <circle class="l" cx="60" cy="60" r="22" stroke-width="1" stroke-dasharray="4 3"/>
  <circle class="l" cx="60" cy="60" r="32" stroke-width="1" stroke-dasharray="8 3"/>
  <!-- T↑ω: the ring that closes -->
  <circle class="g" cx="60" cy="60" r="44" stroke-width="2.2"/>
  <circle class="g" cx="60" cy="60" r="49" stroke-width="0.8"/>
  <!-- the arrow of T_P, crossing each ring once -->
  <path class="g" d="M60 57 L60 16" stroke-width="1.2"/>
  <path class="g" d="M55.5 21 L60 14 L64.5 21" stroke-width="1.2"/>
  <!-- four marks at the cardinal points of the outer ring -->
  <path class="g" d="M60 106v8M60 6v8M6 60h8M106 60h8" stroke-width="1.4"/>
</svg>
